# Publishes wiki/ to the GitHub wiki when a push changes it on main. The job checks out main's
# current head, not the pushed commit, so a run that starts late never publishes an older wiki.
name: wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/scripts/wiki_publish.sh"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Publish the wiki
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: wiki
      cancel-in-progress: false
    steps:
      - name: Check out main's head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Publish wiki/
        env:
          WIKI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/wiki_publish.sh
